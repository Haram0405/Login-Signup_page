<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" title="text/css" href="SignupPage.css">
</head>
<body>
    <div class="wrapper">
    <form>
    <div class="header">
    <h1>...SignUp...</h1>
    </div>
    <div class="input-box">
        <label><input type="text" placeholder="Username" required></label>
    </div>
    <div class="input-box">
        <label><input type="text" placeholder="Email" required></label>
    </div>
    <div class="input-box">
        <label><input type="password" placeholder="Enter Password" required></label>
    </div>
    <div class="input-box">
        <label><input type="password" placeholder="Confirm Password" required></label>
    </div>
    <div class="pushbutton">
        <button type="submit">Sign Up</button>
    </div>
    <div class="link">
        <p>
            Already have an account ? <a href="LoginPage.html">Login here.</a>
        </p>
    </div>
</form>
</div>
</body>
</html>
