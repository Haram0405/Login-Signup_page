<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" title="text/css" href="LoginPage.css">
</head>
<body>
    <div class="container">
    <form>
    <div class="header">
    <h1>...Login...</h1>
    </div>
    <div class="input-box">
        <label><input type="text" placeholder="Enter Email or Phone #" required></label>
    </div>
    <div class="input-box">
        <label><input type="password" placeholder="Enter Password" required></label>
    </div>
    <div class="Rememberme">
        <label><input type="checkbox"> Remember me.</label>
        <a href="#">Forgot Password ?</a>
    </div>
    <div class="footer">
        <button type="submit">Login</button>
        <p>Don't have an account ? <a href="SignupPage.html">Sign In Now</a> </p>
    </div>
    </div>
    </form>
    </div>
</body>
</html>
